[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman"
version = "0.3.0"
description = "KALMAN III — Sovereign Autonomous Broadcast-Reliability Crew (House of Asura, Agentic Cinema hackathon)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Om Shukla" }]

[tool.kalman]
# The lineage. Bump on a "big big" change: KALMAN -> KALMAN II -> KALMAN III.
regnal = "KALMAN III"
lineage = "House of Asura"

[tool.setuptools.packages.find]
include = ["kalman*"]
